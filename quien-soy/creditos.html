<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Créditos de las fotos</title>
<link rel="stylesheet" href="../shared/estilo.css">
<link rel="icon" href="../icono.svg" type="image/svg+xml">
<meta name="theme-color" content="#1d1449">
<style>
.creditos{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.cred{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.06);border-radius:16px;padding:10px}
.cred img{width:64px;height:64px;border-radius:12px;flex:none;object-fit:cover}
.cred b{display:block}
.cred span{display:block;color:var(--mute);font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.cred a{color:var(--ink)}
</style>
</head>
<body>
<main>
  <div class="barra"><a class="volver" href="./">← Volver al juego</a></div>
  <h1>📸 Créditos de las fotos</h1>
  <p class="sub">Las fotos de los mazos que vienen con el juego son de
    <a href="https://commons.wikimedia.org/">Wikimedia Commons</a>, con licencias libres. Están recortadas y achicadas,
    y cada una mantiene la licencia de la original. Tocá la licencia o "ver original" para más detalles.</p>
  <div id="lista"></div>
</main>
<script type="module">
import { FOTOS } from './fotos/creditos.js';
import { TITULOS } from './famosos.js';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
document.getElementById('lista').innerHTML = Object.entries(FOTOS).map(([mazo, cartas]) =>
  `<section><h2>${TITULOS[mazo] || mazo}</h2><div class="creditos">${Object.entries(cartas).map(([nombre, c]) =>
    `<div class="cred"><img src="${esc(c.img)}" alt="${esc(nombre)}" loading="lazy"><div><b>${esc(nombre)}</b>
      <span>Foto: ${esc(c.autor)}</span>
      <span>${c.licenciaUrl ? `<a href="${esc(c.licenciaUrl)}" target="_blank" rel="noopener">${esc(c.licencia)}</a>` : esc(c.licencia)}
        · <a href="${esc(c.pagina)}" target="_blank" rel="noopener">ver original</a></span></div></div>`).join('')}</div></section>`).join('');
</script>
</body>
</html>
