<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Más alto o más bajo</title>
<link rel="stylesheet" href="../shared/estilo.css">
<link rel="icon" href="../icono.svg" type="image/svg+xml">
<meta name="theme-color" content="#1d1449">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A Juegar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
#tablero{max-width:min(100%,480px)}
.ab-topes label span{width:auto;padding:0 14px;font-size:17px}
.ab-panel{background:rgba(255,255,255,.06);border:2px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:14px}
.ab-panel h3{margin:0 0 6px;font-size:19px}
.ab-titulo{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ab-rendirse{min-height:36px;padding:4px 12px;font-size:14px}
.ab-msg{text-align:center;font-size:18px;margin:10px 0 0}
.ab-tuyo{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-weight:600}
.ab-ver{min-height:36px;min-width:36px;padding:0}
.ab-num{display:inline-block;background:var(--wood);color:var(--oscuro);border-radius:9px;padding:1px 10px;box-shadow:0 3px 0 #c98a4a;
  font-variant-numeric:tabular-nums}

/* Lo que estás escribiendo */
.ab-pista{text-align:center;margin:0 0 8px;font-size:17px}
.ab-visor{text-align:center;font-size:42px;font-weight:700;min-height:62px;line-height:62px;margin:0 auto 12px;max-width:340px;
  background:rgba(10,5,40,.35);border:3px solid var(--amarillo);border-radius:16px;font-variant-numeric:tabular-nums}
.ab-teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:340px;margin:0 auto}
.ab-teclado button{min-height:54px;padding:0;border-radius:14px;font-size:26px;font-weight:700;background:var(--wood);color:var(--oscuro);box-shadow:0 4px 0 #c98a4a}
.ab-teclado .ab-borrar{background:var(--btn);color:inherit;box-shadow:none}
.ab-teclado .ab-ok{background:var(--ok);color:var(--oscuro);box-shadow:0 4px 0 #2f8a55}

/* Historial */
.ab-hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ab-hist li{display:flex;align-items:center;gap:10px;background:rgba(10,5,40,.3);border-radius:14px;padding:6px 10px}
.ab-hist li:first-child{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.ab-hist .nro{width:22px;text-align:right;color:var(--mute);font-size:14px}
.ab-res{margin-left:auto;padding:3px 10px;border-radius:8px;background:rgba(10,5,40,.45);font-weight:700;white-space:nowrap}
.ab-res.sube{color:#ffb547}
.ab-res.baja{color:#7cc8ff}
.ab-res.ok{color:var(--ok)}
.ab-hist.chico li{font-size:14px;padding:4px 10px}
.ab-rival{background:rgba(10,5,40,.35);border-radius:16px;padding:10px 14px}
.ab-rival summary{cursor:pointer}
.ab-rival .ab-hist{margin-top:8px}
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
  import { montar } from '../shared/salas.js';
  import * as reglas from './reglas.js';
  import * as juego from './juego.js';
  montar({ reglas, juego });
</script>
</body>
</html>
