<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Ordenados</title>
<link rel="stylesheet" href="../shared/estilo.css">
<link rel="icon" href="../icono.svg" type="image/svg+xml">
<meta name="theme-color" content="#1d1449">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A Juegar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
#tablero{max-width:min(100%,540px)}
.or-tema{text-align:center;background:var(--wood);color:var(--oscuro);border-radius:22px;padding:14px 16px;margin-bottom:14px;
  box-shadow:0 6px 0 rgba(10,5,40,.4)}
.or-tema .note{color:#6b5a8f;margin:0}
.or-tema h3{margin:2px 0 8px;font-size:clamp(20px,5.5vw,26px)}
.or-escala{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.or-escala span:not(.or-flecha){flex:1}
.or-escala span:first-child{text-align:left}
.or-escala span:last-child{text-align:right}
.or-escala b{display:block;font-size:20px}
.or-flecha{flex:2;height:8px;border-radius:4px;background:linear-gradient(90deg,#5cc3f5,#ffd23f,#ff7a85)}
.or-mio{margin:12px 0 0;font-size:17px}
.or-mio b{display:inline-block;background:var(--oscuro);color:var(--amarillo);border-radius:12px;padding:2px 14px;font-size:26px;margin-left:4px}
.or-panel{background:rgba(255,255,255,.06);border:2px solid var(--line);border-radius:22px;padding:14px 14px;margin-bottom:14px}
.or-panel > p{margin:0 0 10px}
.or-punta{color:var(--mute);font-size:14px;font-weight:600;margin:0 4px 6px !important}
.or-lista{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:8px}
.or-lista li{display:flex;align-items:center;gap:10px;background:rgba(10,5,40,.35);border-radius:16px;padding:8px 8px 8px 10px;
  border-left:5px solid var(--c);animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.or-lista li.mia{background:rgba(255,210,63,.14)}
.or-pos,.or-num{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.1);font-weight:700}
.or-num{background:var(--amarillo);color:var(--oscuro);width:40px}
.or-txt{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.or-txt small{display:flex;align-items:center;gap:5px;font-weight:400;color:var(--mute);font-size:13px;margin-top:2px}
.or-mover{display:flex;flex-direction:column;gap:4px}
.or-mover button{min-height:30px;width:40px;padding:0;font-size:13px;border-radius:9px}
.or-marca{font-size:22px;font-weight:700;width:28px;text-align:center}
.or-lista li.bien .or-marca{color:var(--ok)}
.or-lista li.mal{opacity:.75}
.or-lista li.mal .or-marca{color:var(--bad)}
.or-listo{width:100%;margin-top:10px}
.or-resultado{text-align:center;font-size:20px;margin:12px 0 0 !important}
.or-panel .grande{width:100%}
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
  import { montar } from '../shared/salas.js';
  import * as reglas from './reglas.js';
  import * as juego from './juego.js';
  montar({ reglas, juego });
</script>
</body>
</html>
