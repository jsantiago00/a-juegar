<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Dos verdades y una mentira</title>
<link rel="stylesheet" href="../shared/estilo.css">
<link rel="icon" href="../icono.svg" type="image/svg+xml">
<meta name="theme-color" content="#1d1449">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A Juegar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
#tablero{max-width:min(100%,540px)}
.dv-panel{background:rgba(255,255,255,.06);border:2px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:14px}
.dv-panel h3{margin:0 0 10px;font-size:21px;display:flex;align-items:center;gap:6px}
.dv-panel > .note:first-child{margin:0}
.dv-panel textarea{width:100%;resize:vertical;font:inherit;font-size:17px;padding:10px 14px;margin-bottom:10px;border-radius:14px;
  background:rgba(10,5,40,.35);color:var(--ink);border:2px solid var(--line)}
.dv-panel textarea:focus{border-color:var(--amarillo);outline:none}
.dv-label{display:block;font-weight:600;margin:4px 0 6px;color:var(--ink)}
.dv-label.mentira{color:#ffb4c0}
.dv-panel .grande{width:100%;margin-top:4px}
.dv-frases{display:grid;gap:10px;margin:8px 0 12px}
.dv-frase{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;width:100%;border-radius:18px;padding:12px 14px;
  background:var(--wood);color:var(--oscuro);box-shadow:0 5px 0 #c98a4a;font-weight:400}
.dv-frase p{margin:0;font-size:17px;font-weight:600;line-height:1.35}
.dv-voto{flex-direction:row;align-items:center;gap:12px;min-height:60px}
.dv-voto.elegida{background:var(--amarillo);box-shadow:0 5px 0 #c99a00;outline:3px solid #fff;outline-offset:-3px}
.dv-n{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--oscuro);color:var(--ink);font-weight:700}
.dv-frase.mentira{background:#ffd0d6;box-shadow:0 5px 0 #d97a8a}
.dv-frase.verdad{opacity:.9}
.dv-sello{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.dv-frase small{color:#6b5a8f}
.dv-res{text-align:center;margin:0 0 12px}
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
  import { montar } from '../shared/salas.js';
  import * as reglas from './reglas.js';
  import * as juego from './juego.js';
  montar({ reglas, juego });
</script>
</body>
</html>
