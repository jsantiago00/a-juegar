<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ta-te-ti</title>
<link rel="stylesheet" href="../shared/estilo.css">
<link rel="icon" href="../icono.svg" type="image/svg+xml">
<meta name="theme-color" content="#1d1449">
<style>
.tateti{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:380px;margin:0 auto;
  background:var(--groove);padding:12px 12px 16px;border-radius:24px;box-shadow:0 8px 0 rgba(10,5,40,.45)}
.tateti button{aspect-ratio:1;border-radius:16px;background:var(--wood);font-size:60px;font-weight:700;padding:0;
  box-shadow:0 5px 0 #c98a4a}
.tateti button:not(:disabled):hover{background:#fff}
.tateti button:disabled{opacity:1;cursor:default}
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
  import { montar } from '../shared/salas.js';
  import * as reglas from './reglas.js';
  import * as juego from './juego.js';
  montar({ reglas, juego });
</script>
</body>
</html>
