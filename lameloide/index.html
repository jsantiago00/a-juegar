<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lameloide</title>
<link rel="stylesheet" href="../shared/estilo.css">
<link rel="icon" href="../icono.svg" type="image/svg+xml">
<meta name="theme-color" content="#1d1449">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A Juegar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
#tablero{max-width:100%}
#board{width:100%;height:auto;display:block;touch-action:manipulation;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35))}
#board .hex{stroke:var(--groove);stroke-width:2}
#board .hex.libre{cursor:pointer}
#board .borde{stroke-width:9;stroke-linecap:round;pointer-events:none}
#board .ultm{fill:rgba(255,255,255,.75);pointer-events:none}
#board .lbl{fill:var(--mute);font-size:12px;font-weight:600;text-anchor:middle;pointer-events:none}
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
  import { montar } from '../shared/salas.js';
  import * as reglas from './reglas.js';
  import * as juego from './juego.js';
  montar({ reglas, juego });
</script>
</body>
</html>
