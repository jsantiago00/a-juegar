<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Mancala</title>
<link rel="stylesheet" href="../shared/estilo.css">
<link rel="icon" href="../icono.svg" type="image/svg+xml">
<meta name="theme-color" content="#1d1449">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A Juegar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
#tablero{max-width:min(100%,600px)}
.mc{display:grid;grid-template-columns:1fr repeat(6,1.1fr) 1fr;gap:4px 5px;align-items:center;background:var(--groove);
  padding:8px;border-radius:28px;box-shadow:0 8px 0 rgba(10,5,40,.45)}
/* Granero: el número grande y el color de su dueño */
.mc-gran{grid-row:span 2;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border-radius:20px;background:var(--wood2);color:var(--oscuro);box-shadow:inset 0 5px 0 rgba(120,60,10,.25),inset 0 0 0 3px var(--c);
  min-height:130px}
.mc-gran b{font-size:clamp(24px,7vw,34px);line-height:1}
.mc-gran small{font-size:12px;font-weight:600;color:#7a5a2a;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:1px}
.mc-gran.cae{animation:pop .3s cubic-bezier(.3,1.6,.5,1);box-shadow:inset 0 5px 0 rgba(120,60,10,.25),inset 0 0 0 3px var(--c),0 0 0 3px #fff}
/* Hoyo con su número afuera: arriba en la fila de arriba, abajo en la de abajo */
.mc-celda{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.mc-celda.abajo{flex-direction:column-reverse}
.mc-num{font-size:16px;line-height:1.1;color:var(--oscuro);min-height:18px;transition:transform .15s}
.mc-num.cae{transform:scale(1.35);color:#fff;text-shadow:0 1px 0 rgba(10,5,40,.6)}
.mc-hoyo{position:relative;width:100%;aspect-ratio:1;min-height:0;padding:0;border-radius:50%;background:var(--wood2);
  box-shadow:inset 0 4px 0 rgba(120,60,10,.25);overflow:hidden;transition:transform .15s}
.mc-hoyo:disabled{opacity:1;cursor:default}
.mc-hoyo:active:not(:disabled){transform:scale(.94);box-shadow:inset 0 4px 0 rgba(120,60,10,.25)}
.mc-hoyo.toca{box-shadow:inset 0 4px 0 rgba(120,60,10,.25),0 0 0 3px var(--c)}
.mc-hoyo.toca:hover{transform:translateY(-2px)}
/* Las semillas: todas iguales, como porotos */
.mc-hoyo i{position:absolute;width:22%;height:22%;margin:-11% 0 0 -11%;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55) 0 18%,transparent 22%),#8a4b2a;box-shadow:inset -1px -2px 0 rgba(0,0,0,.3)}
.mc-hoyo.desde{background:#f3d29a}
.mc-hoyo.cae{animation:pop .3s cubic-bezier(.3,1.6,.5,1);box-shadow:inset 0 4px 0 rgba(120,60,10,.25),0 0 0 3px #fff}
.mc-hoyo.ult,.mc-gran.ult{outline:3px solid #fff;outline-offset:-3px}
.mc-hoyo.robado{background:#ffb4b4}
.mc-nombres{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;margin:8px 4px;font-size:16px}
.mc-nombres span:last-child{color:var(--mute);font-size:14px;flex-basis:100%;padding-left:24px}
.mc-sentido{text-align:center;margin:6px 0 0;font-size:14px}
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
  import { montar } from '../shared/salas.js';
  import * as reglas from './reglas.js';
  import * as juego from './juego.js';
  montar({ reglas, juego });
</script>
</body>
</html>
