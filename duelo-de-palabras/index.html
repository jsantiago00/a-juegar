<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Duelo de palabras</title>
<link rel="stylesheet" href="../shared/estilo.css">
<link rel="icon" href="../icono.svg" type="image/svg+xml">
<meta name="theme-color" content="#1d1449">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A Juegar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
#tablero{max-width:min(100%,520px)}
.dp-panel{background:rgba(255,255,255,.06);border:2px solid var(--line);border-radius:22px;padding:14px 12px;margin-bottom:14px}
.dp-panel h3{margin:0 0 6px;font-size:19px}
.dp-titulo{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dp-rendirse{min-height:36px;padding:4px 12px;font-size:14px}
.dp-msg{text-align:center;font-size:18px;margin:10px 0 0}
.dp-tuya{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-weight:600}
.dp-ver{min-height:36px;min-width:36px;width:36px;padding:0}

/* Letras */
.dp-pal{display:inline-flex;gap:4px;vertical-align:middle}
.dp-l{display:inline-grid;place-items:center;width:32px;height:36px;border-radius:8px;font-weight:700;font-size:19px;
  background:var(--wood);color:var(--oscuro);box-shadow:0 3px 0 #c98a4a}
.dp-l.v{background:#3fbf7f;color:#fff;box-shadow:0 3px 0 #2a8a58}
.dp-l.a{background:#f4c430;color:var(--oscuro);box-shadow:0 3px 0 #c99a00}
.dp-l.g{background:#4a3f74;color:#c9bdf2;box-shadow:0 3px 0 rgba(10,5,40,.5)}
.dp-l.tap{background:var(--btn);color:var(--mute);box-shadow:none}
.dp-l.mini{width:14px;height:14px;border-radius:4px;box-shadow:none;vertical-align:-2px}
.dp-ley{margin:2px 0 10px;font-size:13px}

/* Lo que estás escribiendo */
.dp-slots{display:flex;justify-content:center;gap:6px;margin:2px 0 14px}
.dp-l.grande{width:min(50px,13vw);height:min(56px,14.5vw);font-size:28px;background:rgba(10,5,40,.35);color:var(--ink);
  border:3px solid var(--line);box-shadow:none}
.dp-l.grande.cursor{border-color:var(--amarillo)}

/* Teclado */
.dp-teclado{display:grid;gap:6px;margin:0 auto 12px;max-width:440px}
.dp-teclado div{display:flex;justify-content:center;gap:4px}
.dp-teclado button{flex:1 1 0;max-width:40px;min-width:0;min-height:46px;padding:0;border-radius:9px;font-size:17px;font-weight:700;
  background:var(--wood);color:var(--oscuro);box-shadow:0 3px 0 #c98a4a}
.dp-teclado button.v{background:#3fbf7f;color:#fff;box-shadow:0 3px 0 #2a8a58}
.dp-teclado button.a{background:#f4c430;box-shadow:0 3px 0 #c99a00}
.dp-teclado button.g{background:#4a3f74;color:#9a8fc0;box-shadow:0 3px 0 rgba(10,5,40,.5)}
.dp-teclado button.dp-borrar{max-width:60px;flex-grow:1.5;background:var(--btn);color:var(--ink);box-shadow:0 3px 0 rgba(10,5,40,.55)}
.dp-ok{width:100%}

/* Historial */
.dp-hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.dp-hist li{display:flex;align-items:center;gap:10px;background:rgba(10,5,40,.3);border-radius:14px;padding:6px 10px}
.dp-hist li:first-child{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.dp-hist .nro{width:22px;text-align:right;color:var(--mute);font-size:14px}
.dp-hist.chico .dp-l{width:24px;height:28px;font-size:15px;border-radius:6px}
.dp-rival{background:rgba(10,5,40,.35);border-radius:16px;padding:10px 14px}
.dp-rival:empty{display:none}
.dp-rival summary{cursor:pointer}
.dp-rival .dp-hist{margin-top:8px}
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
  import { montar } from '../shared/salas.js';
  import * as reglas from './reglas.js';
  import * as juego from './juego.js';
  montar({ reglas, juego });
</script>
</body>
</html>
