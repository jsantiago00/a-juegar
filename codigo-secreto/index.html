<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Código secreto</title>
<link rel="stylesheet" href="../shared/estilo.css">
<link rel="icon" href="../icono.svg" type="image/svg+xml">
<meta name="theme-color" content="#1d1449">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A Juegar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
#tablero{max-width:min(100%,520px)}
.cs-modos label span{width:auto;padding:0 16px;font-size:18px}
.cs-panel{background:rgba(255,255,255,.06);border:2px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:14px}
.cs-panel h3{margin:0 0 6px;font-size:19px}
.cs-titulo{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cs-rendirse{min-height:36px;padding:4px 12px;font-size:14px}
.cs-ley{margin:2px 0 10px;font-size:13px}
.cs-msg{text-align:center;font-size:18px;margin:10px 0 0}
.cs-tuyo{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-weight:600}
.cs-ver{min-height:36px;min-width:36px;padding:0}

/* Fichas: número sobre madera o bolita de color */
.cs-cod{display:inline-flex;gap:5px;vertical-align:middle}
.cs-f{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;font-weight:700;font-size:20px;flex:none}
.cs-f.num{background:var(--wood);color:var(--oscuro);box-shadow:0 3px 0 #c98a4a}
.cs-f.bola{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8 0 18%,transparent 19%),var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 0 0 2px rgba(10,5,40,.35)}
.cs-f.vacia{background:rgba(10,5,40,.35);border:2px dashed var(--line)}
.cs-f.tapada{background:var(--btn);color:var(--mute);font-size:17px}

/* Lo que estás armando */
.cs-slots{display:flex;justify-content:center;gap:10px;margin:4px 0 14px}
.cs-slot{padding:6px;border-radius:16px;background:rgba(10,5,40,.35);border:3px solid transparent;min-height:0;box-shadow:none}
.cs-slot.cursor{border-color:var(--amarillo)}
.cs-slot .cs-f{width:52px;height:52px;font-size:32px;border-radius:12px}
.cs-slot .cs-f.bola{border-radius:50%}
.cs-teclado{display:grid;gap:8px;max-width:400px;margin:0 auto}
.cs-teclado.numeros{grid-template-columns:repeat(5,1fr)}
.cs-teclado.colores{grid-template-columns:repeat(3,1fr)}
.cs-teclado.numeros button{min-height:52px;padding:0;border-radius:14px;font-size:24px;font-weight:700;background:var(--wood);color:var(--oscuro);box-shadow:0 4px 0 #c98a4a}
.cs-teclado.colores button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:14px}
.cs-teclado .bola-t{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8 0 18%,transparent 19%),var(--c);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.cs-teclado small{font-size:13px}
.cs-acciones{justify-content:center;margin-top:14px}

/* Historial */
.cs-hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cs-hist li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(10,5,40,.3);border-radius:14px;padding:6px 10px}
.cs-hist li:first-child{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.cs-hist .nro{width:22px;text-align:right;color:var(--mute);font-size:14px}
.cs-res{display:inline-flex;gap:6px;margin-left:auto;font-weight:700;font-size:15px}
.cs-res span{padding:3px 9px;border-radius:8px;background:rgba(10,5,40,.45);white-space:nowrap}
.cs-res .bien{color:var(--ok)}
.cs-res .errado{color:#ffb547}
.cs-hist.chico .cs-f{width:24px;height:24px;font-size:15px;border-radius:7px}
.cs-hist.chico .cs-f.bola{border-radius:50%}
.cs-hist.chico .cs-res{font-size:13px}
.cs-rival{background:rgba(10,5,40,.35);border-radius:16px;padding:10px 14px}
.cs-rival summary{cursor:pointer}
.cs-rival .cs-hist{margin-top:8px}
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
  import { montar } from '../shared/salas.js';
  import * as reglas from './reglas.js';
  import * as juego from './juego.js';
  montar({ reglas, juego });
</script>
</body>
</html>
