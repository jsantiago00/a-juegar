<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Críptico</title>
<link rel="stylesheet" href="../shared/estilo.css">
<link rel="icon" href="../icono.svg" type="image/svg+xml">
<meta name="theme-color" content="#1d1449">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A Juegar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
#tablero{max-width:min(100%,540px)}
.cr-panel{background:rgba(255,255,255,.06);border:2px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:14px}
.cr-panel h3{margin:0 0 6px;font-size:19px}
.cr-panel textarea{width:100%;min-height:84px;resize:vertical;font:inherit;font-size:17px;padding:10px 14px;border-radius:16px;
  border:2px solid var(--line);background:rgba(10,5,40,.35);color:var(--ink);box-sizing:border-box}
.cr-panel .grande{width:100%}
.cr-enviar{justify-content:space-between;margin-top:8px}
.cr-enviar .note{margin:0}
.cr-secreta{background:var(--amarillo);color:var(--oscuro);padding:2px 10px;border-radius:10px;letter-spacing:2px}
.cr-pista{text-align:center;background:var(--wood);color:var(--oscuro);border-radius:22px;padding:14px 18px;margin-bottom:14px;
  box-shadow:0 6px 0 rgba(10,5,40,.45);animation:entra .45s cubic-bezier(.3,1.6,.5,1)}
.cr-pista .note{color:#6b5a8f;margin:0}
.cr-tu-pista{font-size:clamp(19px,5.5vw,24px);font-weight:600;font-style:italic;margin:6px 0;overflow-wrap:anywhere}
.cr-letras{margin:4px 0 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.cr-rayas{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-family:monospace;font-size:clamp(18px,5vw,24px);letter-spacing:4px;font-weight:700}
.cr-arriesgar{justify-content:center;margin:0 auto 6px}
.cr-arriesgar input{flex:1;min-width:0;text-transform:uppercase;letter-spacing:2px;font-weight:600}
.cr-msg,.cr-autor{text-align:center;margin:0 0 12px;font-size:17px;color:var(--mute)}
.cr-msg b,.cr-autor{color:var(--ink)}
s{color:var(--bad);text-decoration-thickness:2px;text-transform:uppercase}
.cr-otros{margin-top:12px;display:grid;gap:6px}
.cr-otro{background:rgba(10,5,40,.35);border-radius:16px;padding:8px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cr-otro .note{margin:0;letter-spacing:1px}
.cr-otro .dot,.cr-res .dot{width:12px;height:12px}
.cr-res{list-style:none;padding:0;margin:8px 0 14px;display:grid;gap:6px}
.cr-res li{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(10,5,40,.3);border-radius:14px;padding:6px 12px}
.cr-res .note{margin:0;flex:1}
.cr-res b:last-child{color:var(--ok)}
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
  import { montar } from '../shared/salas.js';
  import * as reglas from './reglas.js';
  import * as juego from './juego.js';
  montar({ reglas, juego });
</script>
</body>
</html>
